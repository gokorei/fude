name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check the wrapper is the committed one
        # A wrapper that differs from the one in the tree means the build is not
        # the build anyone reviewed.
        run: |
          ./gradlew --version
          git diff --exit-code gradle/wrapper/gradle-wrapper.properties

      - name: Build
        # Runs the architecture check via `check`, which fails if commonMain
        # reaches for Opal, java.*, or (in :fude-core) Compose.
        run: ./gradlew build --stacktrace

      - name: Architecture check
        run: ./gradlew checkArchitecture

  # iOS, web and Wasm targets are deliberately not declared yet: they need a
  # machine with Xcode to verify, and an unverified target in a build matrix is
  # worse than an absent one. This job exists to fail loudly the moment they are
  # added without a macOS leg.
  missing-targets:
    name: Target coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Declared targets
        run: |
          echo "Targets declared in fude/build.gradle.kts:"
          grep -E '^\s+(jvm|android|iosX64|iosArm64|iosSimulatorArm64|js|wasmJs)\(' fude/build.gradle.kts || true
          echo
          echo "If iOS/web/Wasm appear here, add a macOS job before merging."
